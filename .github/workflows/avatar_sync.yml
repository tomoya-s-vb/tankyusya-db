name: Discord Avatar Sync

on:
  schedule:
    # 毎週水曜 5:00 JST (= 前日20:00 UTC) に実行。reaction trackerと合わせています。
    - cron: '0 20 * * 2'
  workflow_dispatch: {}  # 手動実行用ボタンを有効化

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r avatar_sync/requirements.txt

      - name: Write service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > avatar_sync/service_account.json

      - name: Run avatar sync
        working-directory: avatar_sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: 探究者DB
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python discord_avatar_sync.py
